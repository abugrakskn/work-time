<div class="create-page">

  <mat-card class="form-card">

    <mat-card-header>

      <mat-card-title>
        {{ isEditMode() ? 'Edit Project' : 'Create Project' }}
      </mat-card-title>

    </mat-card-header>

    <mat-card-content>

      <form
        class="project-form"
        (ngSubmit)="saveProject()">

        <mat-form-field appearance="outline">
          <mat-label>Project Name</mat-label>

          <input
            matInput
            name="name"
            maxlength="100"
            [(ngModel)]="name"
            required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>

          <textarea
            matInput
            name="description"
            rows="4"
            maxlength="1000"
            [(ngModel)]="description">
          </textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Start Date</mat-label>

          <input
            matInput
            [matDatepicker]="startPicker"
            name="startDate"
            [(ngModel)]="startDate">

          <mat-datepicker-toggle
            matIconSuffix
            [for]="startPicker">
          </mat-datepicker-toggle>

          <mat-datepicker #startPicker />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>End Date</mat-label>

          <input
            matInput
            [matDatepicker]="endPicker"
            name="endDate"
            [(ngModel)]="endDate">

          <mat-datepicker-toggle
            matIconSuffix
            [for]="endPicker">
          </mat-datepicker-toggle>

          <mat-datepicker #endPicker />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Status</mat-label>

          <mat-select
            name="status"
            [(ngModel)]="status">

            <mat-option value="PLANNED">
              Planned
            </mat-option>

            <mat-option value="ACTIVE">
              Active
            </mat-option>

            <mat-option value="COMPLETED">
              Completed
            </mat-option>

            <mat-option value="CANCELLED">
              Cancelled
            </mat-option>

          </mat-select>
        </mat-form-field>

        <div class="actions">

          <button
            mat-button
            type="button"
            (click)="cancel()">
            Cancel
          </button>

          <button
            mat-flat-button
            type="submit">

            {{ isEditMode() ? 'Save Changes' : 'Create Project' }}

          </button>

        </div>

      </form>

    </mat-card-content>

  </mat-card>

</div>
