<div class="login-container">

    <h1>WorkTime</h1>

    <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input
            matInput
            type="email"
            [(ngModel)]="email">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
            matInput
            type="password"
            [(ngModel)]="password">
    </mat-form-field>

    <button
        mat-flat-button
        color="primary"
        (click)="login()">
        Login
    </button>

</div>
