<div class="login-container">

  <h1>WorkTime</h1>

  <form
    class="login-form"
    (ngSubmit)="login()">

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>

      <input
        matInput
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="email"
        [disabled]="isLoggingIn()"
        required>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>

      <input
        matInput
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        [disabled]="isLoggingIn()"
        required>
    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="isLoggingIn()">

      {{ isLoggingIn() ? 'Logging in...' : 'Login' }}

    </button>

  </form>

</div>
