<div class="task-form-page">

  <mat-card class="form-card">

    <mat-card-header>
      <mat-card-title>
        {{ isEditMode() ? 'Edit Task' : 'Create Task' }}
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>

      <form
        class="task-form"
        (ngSubmit)="saveTask()">

        <mat-form-field appearance="outline">
          <mat-label>Title</mat-label>

          <input
            matInput
            name="title"
            maxlength="100"
            [(ngModel)]="title"
            required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>

          <textarea
            matInput
            name="description"
            rows="4"
            maxlength="1000"
            [(ngModel)]="description">
          </textarea>
        </mat-form-field>

        <div class="form-row">

          <mat-form-field appearance="outline">
            <mat-label>Due Date</mat-label>

            <input
                matInput
                [matDatepicker]="dueDatePicker"
                [min]="minDate"
                name="dueDate"
                [(ngModel)]="dueDate">

            <mat-datepicker-toggle
              matIconSuffix
              [for]="dueDatePicker">
            </mat-datepicker-toggle>

            <mat-datepicker
              #dueDatePicker>
            </mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Estimated Duration</mat-label>

            <input
              matInput
              type="number"
              min="1"
              name="estimatedDurationMinutes"
              [(ngModel)]="estimatedDurationMinutes">

            <span matTextSuffix>min</span>
          </mat-form-field>

        </div>

        <div class="form-row">

          <mat-form-field appearance="outline">
            <mat-label>Priority</mat-label>

            <mat-select
              name="priority"
              [(ngModel)]="priority">

              <mat-option value="LOW">
                Low
              </mat-option>

              <mat-option value="MEDIUM">
                Medium
              </mat-option>

              <mat-option value="HIGH">
                High
              </mat-option>

              <mat-option value="CRITICAL">
                Critical
              </mat-option>

            </mat-select>
          </mat-form-field>

          @if (isEditMode()) {

            <mat-form-field appearance="outline">
              <mat-label>Status</mat-label>

              <mat-select
                name="status"
                [(ngModel)]="status">

                <mat-option value="TODO">
                  Todo
                </mat-option>

                <mat-option value="IN_PROGRESS">
                  In Progress
                </mat-option>

                <mat-option value="COMPLETED">
                  Completed
                </mat-option>

                <mat-option value="CANCELLED">
                  Cancelled
                </mat-option>

              </mat-select>
            </mat-form-field>

          }

        </div>

        <mat-form-field appearance="outline">
          <mat-label>Project</mat-label>

          <mat-select
            name="projectId"
            [(ngModel)]="projectId"
            required>

            @for (project of projects(); track project.id) {

              <mat-option [value]="project.id">
                {{ project.name }}
              </mat-option>

            }

          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Assigned User ID</mat-label>

          <input
            matInput
            type="number"
            name="assignedUserId"
            [(ngModel)]="assignedUserId">

        </mat-form-field>

        <div class="actions">

          <button
            mat-button
            type="button"
            (click)="cancel()">
            Cancel
          </button>

          <button
            mat-flat-button
            type="submit">

            {{ isEditMode() ? 'Save Changes' : 'Create Task' }}

          </button>

        </div>

      </form>

    </mat-card-content>

  </mat-card>

</div>
